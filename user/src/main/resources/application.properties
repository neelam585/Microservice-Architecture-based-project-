spring.application.name=user
server.port=8084
jwt.secret=mysupersecretkeymysupersecretkey
# 1 hour in milliseconds
jwt.expiration=3600000
spring.datasource.url=jdbc:mysql://localhost:3306/users
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

eureka.instance.prefer-ip-address=true
spring.cloud.config.enabled=false

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# KEYCLOAK Configuration
keycloak.admin.username=user
keycloak.admin.password=user
#keycloak.admin.server-url=http://keycloak:8090
keycloak.admin.server-url = http://localhost:8090/
keycloak.admin.realm=interview
keycloak.admin.client-id=admin-cli
