server.port:8080
spring.application.name=gatewayserver
spring.cloud.gateway.routes[0].id=candidate_service
spring.cloud.gateway.routes[0].uri=lb://CANDIDATE
spring.cloud.gateway.routes[0].predicates[0]=Path=/candidate/**

spring.cloud.gateway.routes[1].id=interview_schedule_service
spring.cloud.gateway.routes[1].uri=lb://INTERVIEWSCHEDULE
spring.cloud.gateway.routes[1].predicates[0]=Path=/interview/**

spring.cloud.gateway.routes[2].id=panel_member
spring.cloud.gateway.routes[2].uri=lb://PANELMEMBER
spring.cloud.gateway.routes[2].predicates[0]=Path=/panel/**

spring.cloud.gateway.routes[3].id=user
spring.cloud.gateway.routes[3].uri=lb://USER
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/**

spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=10000

#spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

jwt.secret=mysupersecretkeymysupersecretkey
#spring.config.import=optional:configserver:http://localhost:8071

logging.level.org.springframework.security=DEBUG
spring.cloud.config.enabled=false
# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always
# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
